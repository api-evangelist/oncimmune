name: Oncimmune
description: >-
  Oncimmune is a biotechnology company specializing in antibody and autoantibody
  biomarker discovery for precision medicine. Its proprietary ImmunoINSIGHTS platform
  screens against 9,000+ human antigens using Luminex xMAP bead-based multiplexed
  immunoassay technology, minimal sample volumes, high-throughput automated robotic
  workflows, and proprietary machine-learning algorithms to identify immune-system
  signatures across immuno-oncology, autoimmune disease, and infectious disease.
  Products include the ImmunoINSIGHTS 2K targeted panels, custom biomarker discovery
  services, and bioinformatics/data-science multiomics integration. Oncimmune was
  acquired by Alden Scientific in July 2025. The company operates as a research and
  discovery services provider and does not publish a public developer or API platform.
